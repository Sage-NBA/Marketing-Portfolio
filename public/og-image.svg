<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="glow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#a3e635" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#080808" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#080808"/>
  <circle cx="950" cy="180" r="400" fill="url(#glow)"/>

  <!-- Brand Pill -->
  <g transform="translate(100, 100)">
    <rect width="250" height="42" rx="21" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.15"/>
    <circle cx="24" cy="21" r="5" fill="#a3e635"/>
    <text x="40" y="26" fill="#a3e635" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" letter-spacing="1">DIGITAL GROWTH &amp; SEO</text>
  </g>

  <!-- Main Headline -->
  <g transform="translate(100, 220)">
    <text x="0" y="0" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="800" letter-spacing="-1.5">Get Seen. Get Found.</text>
    <text x="0" y="70" fill="#a3e635" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="800" letter-spacing="-1.5">Get Measurable Results.</text>
    <text x="0" y="130" fill="#9ca3af" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="400">Expert Google Ads Management • Top-Rank SEO • High-ROI Instagram Ads</text>
  </g>

  <!-- Service Tags -->
  <g transform="translate(100, 470)">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="220" height="50" rx="25" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.15"/>
    <text x="30" y="32" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600">Google Ads (PPC)</text>

    <!-- Tag 2 -->
    <rect x="240" y="0" width="230" height="50" rx="25" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.15"/>
    <text x="270" y="32" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600">SEO &amp; Visibility</text>

    <!-- Tag 3 -->
    <rect x="490" y="0" width="230" height="50" rx="25" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.15"/>
    <text x="520" y="32" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600">Instagram Growth</text>
  </g>

  <!-- Logo watermark -->
  <g transform="translate(1000, 500)">
    <text x="0" y="0" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="800">Growth<tspan fill="#a3e635">.</tspan></text>
  </g>
</svg>
